[tool.poetry]
name = "gameshelf-api"
version = "0.1.0"
description = "Backend API for GameShelf — a multi-platform video game library management app"
authors = []
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = ">=0.115.0"
uvicorn = {extras = ["standard"], version = ">=0.32.0"}
pydantic = {extras = ["email"], version = ">=2.10.0"}
pydantic-settings = ">=2.7.0"
httpx = ">=0.28.0"
firebase-admin = ">=6.7.0"
redis = {extras = ["hiredis"], version = ">=5.2.0"}
slowapi = ">=0.1.9"
psnawp = ">=2.1.0"
python-multipart = ">=0.0.18"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-asyncio = ">=0.24"
respx = ">=0.21"
ruff = ">=0.8.0"
mypy = ">=1.13"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["firebase_admin", "firebase_admin.*", "google.cloud.*", "google.oauth2.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["modules.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
